<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>DGL 2026 — Tagungsführer</title>
<meta name="theme-color" content="#0d3b66">
<style>
  :root{
    --navy:#003d73;
    --navy-dark:#00294d;
    --accent:#1d6f5c;
    --bg:#f5f6f4;
    --card:#ffffff;
    --border:#e1e4e0;
    --text:#1c2530;
    --text-muted:#5c6570;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:72px;
  }
  header.topbar{
    background:var(--navy);
    color:#fff;
    padding:0;
  }
  header.topbar img{
    width:100%;
    max-width:720px;
    display:block;
    margin:0 auto;
  }
  .header-meta{
    text-align:center;
    padding:10px 16px 14px;
    font-size:14px;
    color:#dce7f0;
  }
  .header-meta strong{color:#fff;font-size:15px;}
  .lang-switch{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:8px 0 0;
  }
  .lang-btn{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    color:#dce7f0;
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px;
    border-radius:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .lang-btn.active{
    background:#fff;
    color:var(--navy);
    border-color:#fff;
  }
  .flag-icon{
    width:20px;
    height:14px;
    border-radius:2px;
    display:block;
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  .view{display:none;}
  .view.active{display:block;}
  h2.section-title{
    font-size:19px;
    font-weight:600;
    margin:4px 0 12px;
    color:var(--navy);
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .day-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:12px;
    -webkit-overflow-scrolling:touch;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .day-tab.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
    font-weight:600;
  }
  .block-time{
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .block-title{
    font-size:15px;
    font-weight:600;
    margin:0 0 2px;
  }
  .block-subtitle{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 2px;
  }
  .block-room{
    font-size:12px;
    color:var(--text-muted);
  }
  .session-row{
    padding:10px 0;
    border-top:1px solid var(--border);
  }
  .session-row:first-of-type{border-top:none;}
  .session-main{flex:1;min-width:0;}
  .session-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--navy);
    background:#e8eff5;
    border-radius:5px;
    padding:1px 6px;
    margin-right:6px;
  }
  .session-room{
    font-size:11px;
    color:var(--text-muted);
    font-weight:600;
  }
  .session-title{font-size:14px;margin:3px 0 2px;line-height:1.35;}
  .session-mod{font-size:12px;color:var(--text-muted);}
  .add-btn{
    flex:0 0 auto;
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    font-size:17px;
    line-height:1;
    color:var(--navy);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .add-btn.added{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .session-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    cursor:pointer;
  }
  .session-btns{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chevron{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    color:var(--navy);
    background:#eef2f5;
    border-radius:50%;
    font-size:16px;
    flex:0 0 auto;
    transition:transform .15s ease;
  }
  .chevron.open{transform:rotate(90deg);}
  .talk-list{
    margin:2px 0 4px 0;
    padding-left:10px;
    border-left:2px solid var(--border);
  }
  .talk-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:8px 0 8px 8px;
    border-top:1px solid var(--border);
  }
  .talk-row:first-child{border-top:none;}
  .talk-time{
    font-size:11px;
    font-weight:700;
    color:var(--accent);
  }
  .talk-title{font-size:13px;margin:2px 0 2px;line-height:1.35;}
  .talk-authors{font-size:11.5px;color:var(--text-muted);}
  .add-btn.small{width:26px;height:26px;font-size:14px;}
  .talk-main{flex:1;min-width:0;cursor:pointer;}
  .abstract-box{
    font-size:12.5px;
    line-height:1.55;
    color:var(--text);
    background:#f4f6f5;
    border-radius:8px;
    padding:10px 12px;
    margin:2px 0 10px 8px;
  }
  .abstract-empty{
    font-size:12px;
    color:var(--text-muted);
    font-style:italic;
    margin:2px 0 10px 8px;
  }
  .bio-heading{
    font-size:11.5px;
    font-weight:700;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin:4px 0 4px 8px;
  }
  .filter-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:12px;
    padding-bottom:4px;
  }
  .filter-chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#fff;
    font-size:12px;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .lunch-card{
    display:flex;
    justify-content:space-between;
    gap:12px;
  }
  .lunch-name{font-size:15px;font-weight:600;margin:0 0 2px;}
  .lunch-meta{font-size:12px;color:var(--text-muted);margin:0 0 4px;}
  .lunch-note{font-size:13px;color:var(--text);margin:4px 0 0;line-height:1.4;}
  .lunch-dist{
    flex:0 0 auto;
    text-align:right;
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    white-space:nowrap;
  }
  .lunch-links{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
  .pill-link{
    font-size:12px;
    text-decoration:none;
    color:var(--navy);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:14px;
  }
  .exk-title{font-size:15px;font-weight:600;margin:0 0 6px;}
  .exk-meta{font-size:12px;color:var(--text-muted);margin:2px 0;}
  .exk-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .exk-meta-list{
    list-style:none;
    padding:0;
    margin:0 0 8px;
  }
  .exk-meta-list li{
    font-size:12.5px;
    line-height:1.5;
    padding:3px 0;
    border-top:1px solid var(--border);
  }
  .exk-meta-list li:first-child{border-top:none;}
  .exk-detail-p{
    font-size:12.5px;
    line-height:1.55;
    margin:0 0 10px;
  }
  .exk-detail-p:last-child{margin-bottom:0;}
  .exk-info{font-size:13px;margin-top:8px;line-height:1.45;}
  .badge-cost{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    background:#eaf3ee;
    color:var(--accent);
    padding:2px 8px;
    border-radius:10px;
    margin-top:6px;
  }
  .empty-state{
    text-align:center;
    color:var(--text-muted);
    padding:40px 20px;
    font-size:14px;
  }
  .plan-day-heading{
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin:18px 0 6px;
  }
  .plan-day-heading:first-child{margin-top:0;}
  .remove-btn{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:#a33;
    font-size:15px;
    cursor:pointer;
  }
  .plan-actions{display:flex;gap:8px;margin-bottom:14px;}
  .btn-secondary{
    flex:1;
    padding:10px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:#fff;
    color:var(--navy);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .venue-map-link{
    display:block;
    text-align:center;
    background:var(--navy);
    color:#fff;
    text-decoration:none;
    padding:12px;
    border-radius:var(--radius);
    font-size:14px;
    font-weight:600;
    margin:10px 0 16px;
  }
  nav.bottom-nav{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    z-index:10;
  }
  nav.bottom-nav button{
    flex:1;
    background:none;
    border:none;
    padding:8px 2px 10px;
    font-size:10.5px;
    color:var(--text-muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;
  }
  nav.bottom-nav button .ic{font-size:19px;}
  nav.bottom-nav button.active{color:var(--navy);font-weight:700;}
  p.note-inline{font-size:12px;color:var(--text-muted);line-height:1.5;margin-top:18px;}

  /* Search */
  .search-box{
    position:relative;
    margin-bottom:12px;
  }
  .search-input{
    width:100%;
    padding:10px 36px 10px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:14px;
    color:var(--text);
    box-sizing:border-box;
  }
  .search-input:focus{outline:2px solid var(--navy);outline-offset:1px;}
  .search-clear{
    position:absolute;
    right:8px; top:50%;
    transform:translateY(-50%);
    width:24px;height:24px;
    border:none;
    background:#e8eff5;
    border-radius:50%;
    color:var(--text-muted);
    font-size:15px;
    cursor:pointer;
  }
  .search-results{margin-bottom:14px;}
  .search-result-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .search-result-day{
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .search-result-title{font-size:14px;font-weight:600;margin:3px 0 2px;line-height:1.35;}
  .search-result-sub{font-size:12px;color:var(--text-muted);}
  .search-no-results{
    text-align:center;
    color:var(--text-muted);
    padding:20px;
    font-size:13px;
  }

  /* Live / now highlighting */
  .day-tab{position:relative;}
  .day-tab-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--accent);
    margin-left:5px;
    vertical-align:middle;
  }
  .card.now-live{
    border-color:var(--accent);
    box-shadow:0 0 0 1.5px var(--accent);
  }
  .live-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    padding:2px 8px;
    border-radius:10px;
    margin-bottom:6px;
  }
  .live-badge .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:#fff;
  }

  /* Weather widget */
  .weather-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .weather-title{
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:10px;
  }
  .weather-days{
    display:flex;
    justify-content:space-between;
    gap:6px;
  }
  .weather-day{
    flex:1;
    text-align:center;
    font-size:11.5px;
  }
  .weather-day .wd-label{font-weight:700;color:var(--text);margin-bottom:4px;}
  .weather-day .wd-icon{font-size:22px;margin-bottom:2px;}
  .weather-day .wd-temp{color:var(--text-muted);}
  .weather-fallback{
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.5;
  }

  /* Plan conflict warning */
  .plan-conflict{
    display:flex;
    align-items:flex-start;
    gap:6px;
    font-size:12px;
    color:#8a4b00;
    background:#fff4e0;
    border-radius:8px;
    padding:6px 10px;
    margin-top:8px;
  }

  /* Theme toggle */
  .theme-toggle-btn{
    padding:5px 10px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    color:#dce7f0;
    font-size:14px;
    border-radius:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
  }

  /* Topic jump dropdown */
  .topic-jump{
    width:100%;
    padding:9px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    color:var(--text);
    margin-bottom:12px;
    box-sizing:border-box;
  }

  /* Author links inside talk rows */
  .author-link{
    color:var(--navy);
    text-decoration:underline;
    text-decoration-color:var(--border);
    cursor:pointer;
  }
  .author-link:hover{text-decoration-color:var(--navy);}

  /* Next-up card */
  .next-up-card{
    background:var(--navy);
    color:#fff;
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .next-up-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    opacity:.8;
    margin-bottom:4px;
  }
  .next-up-title{font-size:15px;font-weight:600;margin-bottom:2px;}
  .next-up-meta{font-size:12.5px;opacity:.85;}

  /* Share button */
  .share-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .toast{
    position:fixed;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    z-index:100;
    box-shadow:0 4px 16px rgba(0,0,0,.2);
  }

  /* Dark mode */
  body.dark{
    --bg:#14181c;
    --card:#1e2429;
    --border:#2c343b;
    --text:#e6e9eb;
    --text-muted:#9aa5ac;
    --navy:#3d7ab5;
    --navy-dark:#2c5a86;
  }
  body.dark .lunch-note,
  body.dark .abstract-box{
    background:#262e35;
  }
  body.dark .session-tag{
    background:#233042;
  }
  body.dark .day-tab{
    background:var(--card);
  }
  body.dark .search-input,
  body.dark .topic-jump,
  body.dark .filter-chip,
  body.dark .add-btn,
  body.dark .btn-secondary{
    background:var(--card);
    color:var(--text);
  }
  body.dark .chevron{
    background:#233042;
  }
  body.dark .plan-conflict{
    background:#3a2c10;
    color:#ffcf7a;
  }

  /* Announcement popup */
  .announcement-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .announcement-card{
    background:var(--card);
    color:var(--text);
    border-radius:16px;
    padding:24px 20px 20px;
    max-width:420px;
    width:100%;
    position:relative;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .announcement-close{
    position:absolute;
    top:10px; right:10px;
    width:30px; height:30px;
    border:none;
    background:#eef2f5;
    border-radius:50%;
    font-size:18px;
    color:var(--text-muted);
    cursor:pointer;
  }
  .announcement-title{
    font-size:17px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:10px;
    padding-right:24px;
  }
  .announcement-message{
    font-size:14px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .lunch-view-toggle{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .lunch-view-toggle button{
    flex:1;
    padding:8px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    font-weight:600;
    color:var(--text-muted);
    cursor:pointer;
  }
  .lunch-view-toggle button.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }
  #lunchMap{
    height:420px;
    border-radius:var(--radius);
    margin-bottom:12px;
    border:1px solid var(--border);
  }
  .map-loading-note{
    font-size:12px;
    color:var(--text-muted);
    text-align:center;
    margin-bottom:10px;
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>

<header class="topbar">
  <img src="logo.png" alt="DGL Jahrestagung 2026 Logo">
  <div class="lang-switch" id="langSwitch">
    <button class="lang-btn active" data-lang="de" aria-label="Deutsch">
      <svg class="flag-icon" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
        <rect width="30" height="20" y="0" fill="#000"/>
        <rect width="30" height="13.33" y="6.67" fill="#DD0000"/>
        <rect width="30" height="6.67" y="13.33" fill="#FFCE00"/>
      </svg>
      <span>DE</span>
    </button>
    <button class="lang-btn" data-lang="en" aria-label="English">
      <svg class="flag-icon" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
        <rect width="30" height="20" fill="#00247d"/>
        <path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="4"/>
        <path d="M0,0 L30,20 M30,0 L0,20" stroke="#cf142b" stroke-width="1.5"/>
        <path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="6"/>
        <path d="M15,0 V20 M0,10 H30" stroke="#cf142b" stroke-width="3"/>
      </svg>
      <span>EN</span>
    </button>
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Dark mode">
      <span id="themeToggleIcon">&#127769;</span>
    </button>
  </div>
  <div class="header-meta"><strong id="headerTitle">41. DGL-Jahrestagung &amp; WRHC</strong><br><span id="headerDates">14.–18. September 2026</span><br><span id="headerVenue">Erwin-Schrödinger-Zentrum, Berlin-Adlershof</span></div>
</header>

<main>

  <section id="view-programm" class="view active">
    <h2 class="section-title" id="titleProgramm">Programm</h2>
    <div class="search-box">
      <input type="text" id="programmSearch" class="search-input">
      <button id="searchClearBtn" class="search-clear" style="display:none;">&times;</button>
    </div>
    <div id="searchResults" class="search-results" style="display:none;"></div>
    <select id="topicJump" class="topic-jump">
      <option value="">—</option>
    </select>
    <div class="day-tabs" id="dayTabs"></div>
    <div id="programmList"></div>
  </section>

  <section id="view-lunch" class="view">
    <h2 class="section-title" id="titleLunch">Mittagessen in der Nähe</h2>
    <div class="lunch-view-toggle">
      <button id="lunchViewListBtn" class="active" data-view="list"><span id="lunchViewListText">Liste</span></button>
      <button id="lunchViewMapBtn" data-view="map"><span id="lunchViewMapText">Auf Karte anzeigen</span></button>
    </div>
    <div class="filter-row" id="lunchFilters"></div>
    <div id="lunchList"></div>
    <div id="lunchMap" style="display:none;"></div>
    <div id="lunchMapNote" class="map-loading-note" style="display:none;"></div>
  </section>

  <section id="view-exkursionen" class="view">
    <h2 class="section-title" id="titleExk">Exkursionen</h2>
    <div id="exkList"></div>
  </section>

  <section id="view-venue" class="view">
    <h2 class="section-title" id="titleVenue">Tagungsort</h2>
    <div id="weatherBox"></div>
    <div id="venueBox"></div>
  </section>

  <section id="view-plan" class="view">
    <h2 class="section-title" id="titlePlan">Mein Plan</h2>
    <div id="nextUpBox"></div>
    <div class="plan-actions">
      <button class="btn-secondary" id="exportPlanBtn"><span id="exportPlanBtnText">Als Kalender exportieren (.ics)</span></button>
      <button class="btn-secondary share-btn" id="sharePlanBtn" aria-label="Plan teilen">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        <span id="sharePlanBtnText">Teilen</span>
      </button>
    </div>
    <div id="planList"></div>
    <p class="note-inline" id="planNote">Dein Plan wird lokal in diesem Browser gespeichert. Auf einem anderen Gerät oder in einem anderen Browser ist er nicht sichtbar.</p>
  </section>

</main>

<nav class="bottom-nav">
  <button data-view="programm" class="active"><span class="ic">&#128197;</span><span id="navProgramm">Programm</span></button>

  <button data-view="venue"><span class="ic">&#128205;</span><span id="navVenue">Tagungsort</span></button>
  <button data-view="plan"><span class="ic">&#11088;</span><span id="navPlan">Mein Plan</span></button>
</nav>

<div id="announcementOverlay" class="announcement-overlay" style="display:none;">
  <div class="announcement-card">
    <button class="announcement-close" id="announcementCloseBtn">&times;</button>
    <div class="announcement-title" id="announcementTitle"></div>
    <div class="announcement-message" id="announcementMessage"></div>
  </div>
</div>
