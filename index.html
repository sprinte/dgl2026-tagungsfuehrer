<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>DGL 2026 — Tagungsführer</title>
<meta name="theme-color" content="#0d3b66">
<style>
  :root{
    --navy:#003d73;
    --navy-dark:#00294d;
    --accent:#1d6f5c;
    --bg:#f5f6f4;
    --card:#ffffff;
    --border:#e1e4e0;
    --text:#1c2530;
    --text-muted:#5c6570;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:72px;
  }
  header.topbar{
    background:var(--navy);
    color:#fff;
    padding:0;
  }
  header.topbar img{
    width:100%;
    max-width:720px;
    display:block;
    margin:0 auto;
  }
  .header-meta{
    text-align:center;
    padding:10px 16px 14px;
    font-size:14px;
    color:#dce7f0;
  }
  .header-meta strong{color:#fff;font-size:15px;}
  main{
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  .view{display:none;}
  .view.active{display:block;}
  h2.section-title{
    font-size:19px;
    font-weight:600;
    margin:4px 0 12px;
    color:var(--navy);
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .day-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:12px;
    -webkit-overflow-scrolling:touch;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .day-tab.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
    font-weight:600;
  }
  .block-time{
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .block-title{
    font-size:15px;
    font-weight:600;
    margin:0 0 2px;
  }
  .block-subtitle{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 2px;
  }
  .block-room{
    font-size:12px;
    color:var(--text-muted);
  }
  .session-row{
    padding:10px 0;
    border-top:1px solid var(--border);
  }
  .session-row:first-of-type{border-top:none;}
  .session-main{flex:1;min-width:0;}
  .session-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--navy);
    background:#e8eff5;
    border-radius:5px;
    padding:1px 6px;
    margin-right:6px;
  }
  .session-room{
    font-size:11px;
    color:var(--text-muted);
    font-weight:600;
  }
  .session-title{font-size:14px;margin:3px 0 2px;line-height:1.35;}
  .session-mod{font-size:12px;color:var(--text-muted);}
  .add-btn{
    flex:0 0 auto;
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    font-size:17px;
    line-height:1;
    color:var(--navy);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .add-btn.added{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .session-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    cursor:pointer;
  }
  .session-btns{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chevron{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    color:var(--navy);
    background:#eef2f5;
    border-radius:50%;
    font-size:16px;
    flex:0 0 auto;
    transition:transform .15s ease;
  }
  .chevron.open{transform:rotate(90deg);}
  .talk-list{
    margin:2px 0 4px 0;
    padding-left:10px;
    border-left:2px solid var(--border);
  }
  .talk-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:8px 0 8px 8px;
    border-top:1px solid var(--border);
  }
  .talk-row:first-child{border-top:none;}
  .talk-time{
    font-size:11px;
    font-weight:700;
    color:var(--accent);
  }
  .talk-title{font-size:13px;margin:2px 0 2px;line-height:1.35;}
  .talk-authors{font-size:11.5px;color:var(--text-muted);}
  .add-btn.small{width:26px;height:26px;font-size:14px;}
  .filter-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:12px;
    padding-bottom:4px;
  }
  .filter-chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:16px;
    border:1px solid var(--border);
    background:#fff;
    font-size:12px;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .lunch-card{
    display:flex;
    justify-content:space-between;
    gap:12px;
  }
  .lunch-name{font-size:15px;font-weight:600;margin:0 0 2px;}
  .lunch-meta{font-size:12px;color:var(--text-muted);margin:0 0 4px;}
  .lunch-note{font-size:13px;color:var(--text);margin:4px 0 0;line-height:1.4;}
  .lunch-dist{
    flex:0 0 auto;
    text-align:right;
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    white-space:nowrap;
  }
  .lunch-links{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
  .pill-link{
    font-size:12px;
    text-decoration:none;
    color:var(--navy);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:14px;
  }
  .exk-title{font-size:15px;font-weight:600;margin:0 0 6px;}
  .exk-meta{font-size:12px;color:var(--text-muted);margin:2px 0;}
  .exk-info{font-size:13px;margin-top:8px;line-height:1.45;}
  .badge-cost{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    background:#eaf3ee;
    color:var(--accent);
    padding:2px 8px;
    border-radius:10px;
    margin-top:6px;
  }
  .empty-state{
    text-align:center;
    color:var(--text-muted);
    padding:40px 20px;
    font-size:14px;
  }
  .plan-day-heading{
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin:18px 0 6px;
  }
  .plan-day-heading:first-child{margin-top:0;}
  .remove-btn{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    color:#a33;
    font-size:15px;
    cursor:pointer;
  }
  .plan-actions{display:flex;gap:8px;margin-bottom:14px;}
  .btn-secondary{
    flex:1;
    padding:10px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:#fff;
    color:var(--navy);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .venue-map-link{
    display:block;
    text-align:center;
    background:var(--navy);
    color:#fff;
    text-decoration:none;
    padding:12px;
    border-radius:var(--radius);
    font-size:14px;
    font-weight:600;
    margin:10px 0 16px;
  }
  nav.bottom-nav{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    z-index:10;
  }
  nav.bottom-nav button{
    flex:1;
    background:none;
    border:none;
    padding:8px 2px 10px;
    font-size:10.5px;
    color:var(--text-muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;
  }
  nav.bottom-nav button .ic{font-size:19px;}
  nav.bottom-nav button.active{color:var(--navy);font-weight:700;}
  p.note-inline{font-size:12px;color:var(--text-muted);line-height:1.5;margin-top:18px;}
</style>
</head>
<body>

<header class="topbar">
  <img src="logo.png" alt="DGL Jahrestagung 2026 Logo">
  <div class="header-meta"><strong>41. DGL-Jahrestagung &amp; WRHC</strong><br>14.–18. September 2026 · Erwin-Schrödinger-Zentrum, Berlin-Adlershof</div>
</header>

<main>

  <section id="view-programm" class="view active">
    <h2 class="section-title">Programm</h2>
    <div class="day-tabs" id="dayTabs"></div>
    <div id="programmList"></div>
  </section>

  <section id="view-lunch" class="view">
    <h2 class="section-title">Mittagessen in der Nähe</h2>
    <div class="filter-row" id="lunchFilters"></div>
    <div id="lunchList"></div>
  </section>

  <section id="view-exkursionen" class="view">
    <h2 class="section-title">Exkursionen</h2>
    <div id="exkList"></div>
  </section>

  <section id="view-venue" class="view">
    <h2 class="section-title">Tagungsort</h2>
    <div id="venueBox"></div>
  </section>

  <section id="view-plan" class="view">
    <h2 class="section-title">Mein Plan</h2>
    <div class="plan-actions">
      <button class="btn-secondary" id="exportPlanBtn">Als Kalender exportieren (.ics)</button>
    </div>
    <div id="planList"></div>
    <p class="note-inline">Dein Plan wird lokal in diesem Browser gespeichert. Auf einem anderen Gerät oder in einem anderen Browser ist er nicht sichtbar.</p>
  </section>

</main>

<nav class="bottom-nav">
  <button data-view="programm" class="active"><span class="ic">&#128197;</span>Programm</button>
  <button data-view="lunch"><span class="ic">&#127869;</span>Mittagessen</button>
  <button data-view="exkursionen"><span class="ic">&#128506;</span>Exkursionen</button>
  <button data-view="venue"><span class="ic">&#128205;</span>Tagungsort</button>
  <button data-view="plan"><span class="ic">&#11088;</span>Mein Plan</button>
</nav>

<script src="app-data.js"></script>
<script src="app.js"></script>
</body>
</html>
