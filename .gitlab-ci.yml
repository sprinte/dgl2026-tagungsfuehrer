deploy:
  stage: deploy
  script:
    # Windows OpenSSH refuses to use a private key file that other users
    # can read (same issue we hit with Git Bash earlier) — the file GitLab
    # creates for a "File" type variable doesn't guarantee tight permissions,
    # so lock it down explicitly before using it.
    - icacls "$env:SSH_PRIVATE_KEY" /inheritance:r
    - icacls "$env:SSH_PRIVATE_KEY" /grant:r "$($env:USERNAME):(R)"
    - ssh -o StrictHostKeyChecking=no -i "$env:SSH_PRIVATE_KEY" aoprei@dgl2026.igb-berlin.de "cd /var/www/nginx && git pull"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - dgl2026
